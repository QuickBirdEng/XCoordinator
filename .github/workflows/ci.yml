name: CI

on:
  push:
    branches: [master, main, "feature/**", "release/**"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build (iOS Simulator)
        run: Scripts/build.sh

      - name: Build (tvOS)
        # Generic tvOS build (no simulator runtime required) so tvOS support — advertised in the
        # podspec/README — is actually compiled in CI.
        run: |
          xcodebuild build \
            -scheme XCoordinator \
            -destination 'generic/platform=tvOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: Scripts/test.sh

  pod-lint:
    name: CocoaPods lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Lint podspec
        # iOS only: recent Xcode does not ship the tvOS simulator runtime, and the rest
        # of CI (build/test/docs) is iOS-only as well.
        run: pod lib lint --allow-warnings --fail-fast --platforms=ios

  docs:
    name: DocC build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build documentation
        run: Scripts/docs.sh
